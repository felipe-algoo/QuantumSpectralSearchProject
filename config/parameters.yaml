experiment:
  base_seed: 42
  graph_types:
    - path
    - cycle
    - complete
    - erdos_renyi
    - barabasi_albert
  graph_sizes: [16, 32, 64, 128, 256]
  n_instances: 5
  noise_levels: [0.0, 0.001, 0.01, 0.05, 0.1]
  gamma_strategy: average_degree
  t_max_factor: 6.0
  n_time_steps: 400
  use_laplacian: false

graph_kwargs:
  erdos_renyi:
    p: 0.1
  barabasi_albert:
    m: 2

output:
  data_dir: data
  results_dir: results
  figures_dir: results/figures

visualization:
  dpi: 300
  figsize: [7.0, 4.5]
  font_family: serif
  font_size: 11
  palette: deep
  abnt_compliance: true